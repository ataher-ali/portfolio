        body {

        .detail-wrapper {

            transition: max-height 0.35s ease-in-out, opacity 0.3s ease;
            opacity: 0;
        }
        .detail-wrapper.open {
            max-height: 600px;
            opacity: 1;
        }

        .toggle-icon {
            transition: transform 0.25s ease;
        }
        .toggle-icon.open {
            transform: rotate(180deg);
        }

        .action-btn {
            transition: all 0.15s ease;
        }
        .action-btn:hover {

        }

        .director-card {
            transition: box-shadow 0.2s ease, transform 0.15s ease;
        }
        .director-card:hover {
            box-shadow: 0 8px 25px -6px rgba(0, 0, 0, 0.1);
        }

        /* Tab buttons */
        .tab-btn {
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background-color: #ffffff;
            color: #1e293b;
            border-color: #cbd5e1;
            border-bottom-color: white;
            font-weight: 600;
        }
        .tab-btn:not(.active) {
            background-color: #f1f5f9;
            color: #64748b;
            border-color: #e2e8f0;
        }
        .tab-btn:not(.active):hover {
            background-color: #e2e8f0;
        }

        @media (max-width: 480px) {
            .action-btn {

        // ---------- HELPERS ----------
        function bengaliToLatin(bengaliStr) {
            if (!bengaliStr || bengaliStr === '—') return '';
            const map = { '০': '0', '১': '1', '২': '2', '৩': '3', '৪': '4', '৫': '5', '৬': '6', '৭': '7', '৮': '8', '৯': '9' };
            return bengaliStr.replace(/[০-৯]/g, m => map[m]);
        }

        function formatWhatsApp(mobile) {
            const latin = bengaliToLatin(mobile);
            if (!latin) return '';
            const digits = latin.replace(/\D/g, '');
            if (digits.length === 11 && digits.startsWith('01')) return '880' + digits.slice(1);
            return digits;
        }

        // ---------- RENDER CARDS ----------
        function renderCards(data, containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            let html = '';

            data.forEach((item, index) => {
                const mobileLatin = bengaliToLatin(item.mobile);
                const waNumber = formatWhatsApp(item.mobile);
                const hasMobile = mobileLatin && mobileLatin !== '—';
                const hasEmail = item.email && item.email !== '—';

                    <div class="director-card bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                        <!-- Card header (always visible) -->
                        <div class="flex items-center justify-between p-4 cursor-pointer" onclick="toggleCard(this)">
                            <div class="flex flex-wrap items-center gap-x-3 gap-y-1 flex-1">
                                <span class="font-semibold text-gray-800 text-sm sm:text-base">${item.district}</span>
                                <span class="text-gray-700 text-sm sm:text-base">${item.name}</span>
                                <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">${item.designation}</span>
                            </div>
                            <svg class="toggle-icon w-5 h-5 text-gray-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                            </svg>
                        </div>

                        <!-- Detail wrapper (expandable) -->
                        <div class="detail-wrapper">
                            <div class="px-4 pb-4 pt-1 border-t border-gray-100">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1.5 text-sm text-gray-700">
                                    <div><span class="font-medium text-gray-500">জেলা:</span> ${item.district}</div>
                                    <div><span class="font-medium text-gray-500">নাম:</span> ${item.name}</div>
                                    <div><span class="font-medium text-gray-500">পদবী:</span> ${item.designation}</div>
                                    <div><span class="font-medium text-gray-500">অফিস ফোন:</span> ${item.officePhone || '—'}</div>
                                    <div class="sm:col-span-2"><span class="font-medium text-gray-500">ইমেইল:</span> ${item.email || '—'}</div>
                                    <div class="sm:col-span-2 flex flex-wrap gap-2 mt-1">
                                        ${hasMobile ? `
                                            <a href="tel:${mobileLatin}" class="action-btn inline-flex items-center gap-1 bg-blue-100 hover:bg-blue-200 text-blue-800 text-xs px-3 py-1.5 rounded-full">📞 কল</a>
                                            <a href="sms:${mobileLatin}" class="action-btn inline-flex items-center gap-1 bg-purple-100 hover:bg-purple-200 text-purple-800 text-xs px-3 py-1.5 rounded-full">✉️ এসএমএস</a>
                                            <a href="https://wa.me/${waNumber}" target="_blank" class="action-btn inline-flex items-center gap-1 bg-green-100 hover:bg-green-200 text-green-800 text-xs px-3 py-1.5 rounded-full">💬 হোয়াটসঅ্যাপ</a>
                                        ` : ''}
                                        ${hasEmail ? `
                                            <a href="mailto:${item.email}" class="action-btn inline-flex items-center gap-1 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 text-xs px-3 py-1.5 rounded-full">✉️ ইমেইল</a>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ---------- TOGGLE CARD ----------
        function toggleCard(headerElement) {
            const card = headerElement.closest('.director-card');
            const wrapper = card.querySelector('.detail-wrapper');
            const icon = headerElement.querySelector('.toggle-icon');

            if (wrapper.classList.contains('open')) {
                wrapper.classList.remove('open');
                icon.classList.remove('open');
            } else {
                // Close other open cards in the same container
                const container = card.closest('.space-y-3');
                container.querySelectorAll('.detail-wrapper.open').forEach(w => {
                    if (w !== wrapper) {
                        w.classList.remove('open');
                        w.closest('.director-card').querySelector('.toggle-icon').classList.remove('open');
                    }
                });
                wrapper.classList.add('open');
                icon.classList.add('open');
            }
        }

        // ---------- TAB SWITCHING ----------
        function switchTab(tab) {
            const deputyContainer = document.getElementById('deputyContainer');
            const assistantContainer = document.getElementById('assistantContainer');
            const tabDeputy = document.getElementById('tabDeputy');
            const tabAssistant = document.getElementById('tabAssistant');

            if (tab === 'deputy') {
                deputyContainer.classList.remove('hidden');
                assistantContainer.classList.add('hidden');
                tabDeputy.classList.add('active');
                tabAssistant.classList.remove('active');
            } else {
                deputyContainer.classList.add('hidden');
                assistantContainer.classList.remove('hidden');
                tabAssistant.classList.add('active');
                tabDeputy.classList.remove('active');
            }
        }

        // ---------- INIT ----------
        renderCards(deputyDirectors, 'deputyContainer');
        renderCards(assistantDirectors, 'assistantContainer');

        // Ensure only deputy is visible initially (already set in HTML)
        // But if we want to be safe, call switchTab('deputy') after render
        // (Currently deputyContainer is visible, assistant hidden)
    </script>
